<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#FFFFFF" id="meta-theme-color" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="AGNI VOLT Invoice" />
  <title>Invoice Studio — AGNI VOLT ELECTRONIC</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/png" sizes="192x192" href="assets/icon-192.png" />
  <link rel="apple-touch-icon" href="assets/icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script>
    try {
      var s = JSON.parse(localStorage.getItem('aquavault_luxury_state_v2') || '{}');
      if (s.theme === 'dark') {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
      var genKey = 'aquavault_public_cache_gen_v11';
      if (!localStorage.getItem(genKey)) {
        localStorage.setItem(genKey, '1');
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function(regs) {
            regs.forEach(function(r) { r.unregister(); });
          }).catch(function(){});
        }
        if ('caches' in window) {
          caches.keys().then(function(keys) {
            keys.forEach(function(k) {
              if (k !== 'aquavault-cache-v11') caches.delete(k);
            });
          }).catch(function(){});
        }
      }
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="styles.css?v=11" />
</head>
<body data-page="invoice">
  <div id="appRoot"></div>
  <script src="invoice-engine.js?v=11" defer></script>
  <script src="app.js?v=11" defer></script>
</body>
</html>
